<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; background: #f4f5f7; color: #222; }
  header { background: #1a4d8f; color: #fff; padding: 10px 16px; font-weight: 600; }
  nav { display: flex; flex-wrap: wrap; gap: 4px; background: #fff; padding: 6px 12px; border-bottom: 1px solid #ddd; }
  nav button { border: 0; background: none; padding: 8px 12px; cursor: pointer; border-radius: 6px; }
  nav button.active { background: #1a4d8f; color: #fff; }
  main { max-width: 960px; margin: 12px auto; padding: 0 12px; }
  section { display: none; background: #fff; padding: 16px; border-radius: 8px; }
  section.active { display: block; }
  label { display: block; font-size: 12px; color: #555; margin: 8px 0 2px; }
  input, select { width: 100%; padding: 8px; border: 1px solid #bbb; border-radius: 6px; font-size: 14px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row > * { flex: 1 1 140px; }
  button.primary { background: #1a4d8f; color: #fff; border: 0; padding: 10px 16px; border-radius: 6px; cursor: pointer; margin-top: 12px; }
  button.small { padding: 4px 8px; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
  th, td { border-bottom: 1px solid #e3e3e3; padding: 6px; text-align: left; }
  td.r, th.r { text-align: right; }
  #msg { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); background: #222; color: #fff;
         padding: 10px 16px; border-radius: 6px; display: none; }
  .warn { color: #b00020; }
</style>
